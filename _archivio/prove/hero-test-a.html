<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST A — Nastro dietro al nome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg: #0e0e0e;
        --color-text: #f2efe9;
        --color-text-light: #9b968e;
        --color-accent: #6fa3bf;
        --color-accent-deep: #1f3d4d;
        --color-heritage: #b08a5c;
        --color-heritage-light: #d9c3a0;
        --font-display: 'Fraunces', Georgia, serif;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'Space Mono', 'SF Mono', Monaco, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow-x: hidden; }

    .test-banner {
        background: var(--color-accent);
        color: #0e0e0e;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 10px;
    }

    .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .hero::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(14, 14, 14, 0.65) 100%);
    }

    .hero-giant {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none;
    }

    .hero-giant h1 {
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.86;
        font-size: clamp(4rem, 14vw, 11.5rem);
        background: linear-gradient(100deg, var(--color-heritage-light) 0%, var(--color-heritage) 50%, rgba(176, 138, 92, 0.2) 90%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--color-heritage);
    }

    .hero-topbar {
        position: relative;
        z-index: 4;
        display: flex;
        justify-content: space-between;
        padding: 32px clamp(20px, 4vw, 56px) 0;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-accent);
    }

    .hero-filmstrip {
        position: relative;
        z-index: 2;
        margin: auto 0;
        padding: 34px 0;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
    }

    .fs-track {
        display: flex;
        gap: 14px;
        width: max-content;
        animation: fsScroll 42s linear infinite;
    }

    .hero-filmstrip:hover .fs-track {
        animation-play-state: paused;
    }

    .fs-item {
        flex: 0 0 auto;
        width: 300px;
        aspect-ratio: 4 / 5;
        border-radius: 2px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .fs-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    @keyframes fsScroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    @media (max-width: 768px) {
        .fs-item { width: 190px; }
        .hero-giant h1 { font-size: clamp(3rem, 16vw, 6rem); }
    }

    .hero-bottombar {
        position: relative;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 0 24px 44px;
        text-align: center;
    }

    .hero-subtitle {
        font-size: 15px;
        color: rgba(242, 239, 233, 0.8);
        max-width: 480px;
    }

    .hero-subtitle em {
        font-family: var(--font-display);
        font-style: italic;
        color: var(--color-text);
    }

    .cta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        padding: 15px 32px;
        border-radius: 2px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-decoration: none;
    }
    .btn-primary { background: var(--color-text); color: #0e0e0e; }
    .btn-secondary { background: transparent; border: 1px solid rgba(242, 239, 233, 0.4); color: var(--color-text); }

    @media (prefers-reduced-motion: reduce) {
        .fs-track { animation: none; }
    }
</style>
</head>
<body>
    <div class="test-banner">Opzione A — Il nome resta fisso, il movimento viene dalle foto vere che scorrono sopra</div>

    <section class="hero">
        <div class="hero-giant"><h1>MATTIA<br>BUOLI</h1></div>
        <div class="hero-topbar">
            <span>Mantova · 45.15°N 10.79°E</span>
            <span>Fotografo Professionista</span>
        </div>

        <div class="hero-filmstrip">
            <div class="fs-track" id="fsTrack"></div>
        </div>

        <div class="hero-bottombar">
            <p class="hero-subtitle">Fotografia <em>Business & Eventi</em> e <em>Motorsport</em>. Mantova e provincia.</p>
            <div class="cta">
                <a href="#" class="btn btn-primary">Guarda i miei lavori</a>
                <a href="#" class="btn btn-secondary">Contattami</a>
            </div>
        </div>
    </section>

    <script>
        const photos = [
            '../../images/Aziende/thumbs/Aziende-1.jpg', '../../images/Motori/thumbs/Motori-1.jpg',
            '../../images/Aziende/thumbs/Aziende-4.jpg', '../../images/Motori/thumbs/Motori-3.jpg',
            '../../images/Aziende/thumbs/Aziende-7.jpg', '../../images/Motori/thumbs/Motori-5.jpg',
            '../../images/Aziende/thumbs/Aziende-10.jpg', '../../images/Motori/thumbs/Motori-7.jpg',
            '../../images/Aziende/thumbs/Aziende-13.jpg', '../../images/Motori/thumbs/Motori-9.jpg'
        ];
        const track = document.getElementById('fsTrack');
        [...photos, ...photos].forEach((src, i) => {
            const item = document.createElement('div');
            item.className = 'fs-item';
            const img = document.createElement('img');
            img.src = src;
            img.alt = i < photos.length ? `Lavoro ${i + 1}` : '';
            if (i >= photos.length) img.setAttribute('aria-hidden', 'true');
            img.loading = 'lazy';
            item.appendChild(img);
            track.appendChild(item);
        });
    </script>
</body>
</html>
